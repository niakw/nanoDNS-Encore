# nanoDNS Console Blocklist — optional multi-platform publisher profile
# Updated: 2026-11-27 | Base configuration previously tested on PS5 13.60; expanded profile unqualified.
# Community-maintained best-effort DNS filtering; NOT a firewall.
# Installed path: /data/nanodns/nanodns.ini
# OPTIONAL extended profile; NOT DEFAULT; NOT HARDWARE-QUALIFIED.
# 1719 overrides; source capacity 4096; not compatible with the published 128-entry ELF.
# Broad publisher inventory; candidate domains, not a verified endpoint census.
# WARNING: brand-wide masks and the Akamai exact alias may cause collateral blocking.
# DNS traffic bypass, direct IP traffic and pre-payload traffic are OUT OF SCOPE.
# DO NOT USE BEFORE 0.4-13.60.4 VERSION · nanoDNS 13.60
# DO NOT USE BEFORE 0.4-13.60.4 VERSION · nanoDNS 13.60
# DO NOT USE BEFORE 0.4-13.60.4 VERSION · nanoDNS 13.60
[general]
log=/data/nanodns/nanodns.log
debug=0
quiet=0
bind=127.0.0.1
bind6=::1

[upstream]
# Four ordered addresses, two providers; no added threat/ad filtering.
# timeout_ms applies per upstream attempt.
server=76.76.2.0
server=76.76.10.0
server=94.140.14.140
server=94.140.14.141
timeout_ms=1500

[overrides]
# Extended 1719-rule multi-platform profile; 124 canonical rules preserved in order.
# Source target: 4096 overrides and 4096 exceptions; host/console results are separate.
# Publisher discovery: https://platprices.com/publishers/
# https://psdeals.net/au-store/publishers?additional_stores=0&platforms=ps5
# Network reference: https://help.steampowered.com/en/faqs/view/2ea8-4d75-da21-31eb
# https://help.playvs.com/en/articles/4919231-hardware-network-specifications-inclusion-lists
# https://www.netify.ai/resources/applications/riot-games
# New roots are best-effort candidates; ownership, live DNS and actual game traffic not exhaustively verified.
# Broad blocking may disable multiplayer, account access, downloads, game content and shared services.
# Do not use as a WAN firewall or a guarantee against network traffic.
