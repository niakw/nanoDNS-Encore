name: PS5

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v7
        with:
          repository: ps5-payload-dev/sdk
          path: sdk
          ref: 4122b714c7e7a9449d403812b9d640bf7a55af3f

      - name: Setup SDK
        working-directory: sdk
        run: |
          # Hosted runners can carry unrelated third-party APT feeds. They
          # must not make console builds fail before our toolchain is touched.
          grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          make DESTDIR=${{ runner.tool_cache }}/ps5-payload-sdk clean install
          echo PS5_PAYLOAD_SDK=${{ runner.tool_cache }}/ps5-payload-sdk >> $GITHUB_ENV

      - name: Checkout Payload
        uses: actions/checkout@v7

      - name: Build Payload
        run: |
          make clean all

      - name: Upload Payload
        uses: actions/upload-artifact@v7
        with:
          name: Payload
          path: nanodns.elf
          if-no-files-found: error

