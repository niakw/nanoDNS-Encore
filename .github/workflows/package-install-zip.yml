name: Verify historical firmware 13.60.1 release ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanodns-13-60-install-zip
  cancel-in-progress: false

jobs:
  zip-and-publish:
    if: github.repository == 'niakw/nanoDNS-Encore'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.4-13.60.1-beta.1
      BUNDLE: nanodns-13.60-v0.4-13.60.1-beta.1-install.zip
    steps:
      - name: Checkout updated installation documentation
        uses: actions/checkout@v7
      - name: Verify documents and release contract
        run: |
          python3 -m unittest discover -s tests -v
          test -s release/RELEASE_NOTES.md
      - name: Download the existing release assets without modifying them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern nanodns.elf --pattern nanodns.ini --pattern SHA256SUMS
          test -s release-assets/nanodns.elf
          test -s release-assets/nanodns.ini
          grep -q '  nanodns.elf$' release-assets/SHA256SUMS
          grep -q '  nanodns.ini$' release-assets/SHA256SUMS
          (cd release-assets && sha256sum --check --ignore-missing SHA256SUMS)
      - name: Package exactly two FTP-ready files and verify their bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/data/pldmgr/payloads/local/nanodns package/data/nanodns
          cp release-assets/nanodns.elf package/data/pldmgr/payloads/local/nanodns/nanodns.elf
          cp release-assets/nanodns.ini package/data/nanodns/nanodns.ini
          (cd package && zip -q -X -D "../$BUNDLE" data/pldmgr/payloads/local/nanodns/nanodns.elf data/nanodns/nanodns.ini)
          unzip -t "$BUNDLE"
          test "$(unzip -Z -1 "$BUNDLE" | LC_ALL=C sort)" = "$(printf '%s\n' 'data/nanodns/nanodns.ini' 'data/pldmgr/payloads/local/nanodns/nanodns.elf' | LC_ALL=C sort)"
          cmp release-assets/nanodns.elf <(unzip -p "$BUNDLE" data/pldmgr/payloads/local/nanodns/nanodns.elf)
          cmp release-assets/nanodns.ini <(unzip -p "$BUNDLE" data/nanodns/nanodns.ini)
          sha256sum "$BUNDLE" > "$BUNDLE.sha256"
          cat "$BUNDLE.sha256"
      - name: Verify previously published ZIP without modifying the release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installed-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir installed-release --pattern "$BUNDLE" --pattern "$BUNDLE.sha256"
          cmp release-assets/nanodns.elf <(unzip -p "installed-release/$BUNDLE" data/pldmgr/payloads/local/nanodns/nanodns.elf)
          cmp release-assets/nanodns.ini <(unzip -p "installed-release/$BUNDLE" data/nanodns/nanodns.ini)
          (cd installed-release && sha256sum --check "$BUNDLE.sha256")
