name: PS4

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v7
        with:
          repository: ps4-payload-dev/sdk
          path: sdk
          ref: 573b4a0d0d5fa8695cfeee5f5e2f0447c550035d

      - name: Setup SDK
        working-directory: sdk
        run: |
          # Hosted runners can carry unrelated third-party APT feeds. They
          # must not make console builds fail before our toolchain is touched.
          grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          make DESTDIR=${{ runner.tool_cache }}/ps4-payload-sdk clean install
          echo PS4_PAYLOAD_SDK=${{ runner.tool_cache }}/ps4-payload-sdk >> $GITHUB_ENV

      - name: Checkout Payload
        uses: actions/checkout@v7

      - name: Build Payload
        run: |
          make -f Makefile.ps4 clean all

      - name: Upload Payload
        uses: actions/upload-artifact@v7
        with:
          name: Payload
          path: nanodns-ps4.elf
          if-no-files-found: error

