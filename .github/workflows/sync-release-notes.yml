name: Sync release 13.60.3 notes without rebuilding binaries

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanodns-13-60-3-notes
  cancel-in-progress: false

jobs:
  sync-existing-description:
    if: github.repository == 'niakw/nanoDNS-Encore'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.4-13.60.3
    steps:
      - name: Checkout project documentation
        uses: actions/checkout@v7
      - name: Validate documents and test contracts
        run: python3 -m unittest discover -s tests -v
      - name: Update release description only
        shell: bash
        run: |
          set -euo pipefail
          test -s release/RELEASE_NOTES.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/RELEASE_NOTES.md
          echo "Release notes updated; existing binaries, ZIP, SHA256SUMS and tag unchanged."
